[project]
name = "discord-rag-support-bot"
version = "1.0.0"
description = "Discord RAG support bot (Python). Query-only consumer of the existing Pinecone index."
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.4.0",
  "python-dotenv>=1.0.0",
  "google-genai>=1.0.0",
  "pinecone>=5.0.0",
  "httpx>=0.27.0",
  "pyairtable>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
